name: mf6rtm - documentation

on:
  push:
    branches:
      - develop
      - 'docs/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.41.4
          cache: true
          environments: docs

      - name: Build docs (executes tutorials as a regression check)
        run: pixi run -e docs build-docs
