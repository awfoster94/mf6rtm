name: mf6rtm - documentation

on:
  push:
    branches:
      - develop
      - 'docs/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    name: Execute notebooks and build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.41.4
          cache: true
          environments: docs

      - name: Build docs (executes tutorial notebooks)
        run: pixi run -e docs build-docs

      - name: Upload executed notebooks for Read the Docs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: notebooks-for-${{ github.sha }}
          path: docs/tutorials/*.ipynb

  rtd:
    name: Trigger Read the Docs build
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger RTD build
        uses: dfm/rtds-action@v1
        with:
          webhook_url: ${{ secrets.RTDS_WEBHOOK_URL }}
          webhook_token: ${{ secrets.RTDS_WEBHOOK_TOKEN }}
          commit_ref: ${{ github.ref }}
