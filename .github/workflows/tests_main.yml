name: mf6rtm continuous integration

on:
  schedule:
    - cron: '0 8 * * *' # run at 8 AM UTC (12 am PST)
  push:
    branches:
      - develop
  pull_request:
    branches: [main, develop, feature/**]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
      fail-fast: false
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions

    - name: Install Modflow executables
      uses: modflowpy/install-modflow-action@v1
      with:
        subset: mf6,libmf6,gridgen

    - name: Inspect modflow install and export MODFLOW_BIN_DIR
      shell: bash
      run: |
        echo "=== ENV from install action ==="
        # show the variable the action should set (may be empty)
        echo "MODFLOW_BIN_PATH='$MODFLOW_BIN_PATH'"

        # try to find mf6 on PATH (works if install put it on PATH)
        echo "which mf6 -> $(which mf6 || echo 'not found')"

        # if MODFLOW_BIN_PATH is set, show it and its dir
        if [ -n "$MODFLOW_BIN_PATH" ]; then
          echo "MODFLOW_BIN_PATH exists, listing it:"
          ls -l "$MODFLOW_BIN_PATH" || true
          MODFLOW_BIN_DIR=$(dirname "$MODFLOW_BIN_PATH")
          echo "derived MODFLOW_BIN_DIR='$MODFLOW_BIN_DIR'"
          echo "contents of derived dir:"
          ls -l "$MODFLOW_BIN_DIR" || true
        else
          # fallback: try to discover where mf6 was installed
          MF_WHICH=$(which mf6 || true)
          if [ -n "$MF_WHICH" ]; then
            echo "mf6 found at $MF_WHICH (using which)."
            MODFLOW_BIN_DIR=$(dirname "$MF_WHICH")
            echo "derived MODFLOW_BIN_DIR from which: $MODFLOW_BIN_DIR"
            ls -l "$MODFLOW_BIN_DIR" || true
          else
            echo "mf6 not found by which and MODFLOW_BIN_PATH empty — searching common locations..."
            find "$HOME" -maxdepth 3 -type f -name 'mf6*' -print -exec ls -l {} \; || true
          fi
        fi

        # Export for subsequent steps
        if [ -n "$MODFLOW_BIN_DIR" ]; then
          echo "Exporting MODFLOW_BIN_DIR and adding to PATH for subsequent steps"
          echo "MODFLOW_BIN_DIR=$MODFLOW_BIN_DIR" >> "$GITHUB_ENV"
          echo "$MODFLOW_BIN_DIR" >> "$GITHUB_PATH"
          echo "After export, GITHUB_ENV contains:"
          tail -n +1 "$GITHUB_ENV" || true
        else
          echo "ERROR: Could not determine MODFLOW_BIN_DIR — tests will fail. See above."
          false
        fi


    - name: Add executables directory to PATH
      shell: bash
      run: |
        echo "Using MODFLOW_BIN_PATH=$MODFLOW_BIN_PATH"
        MODFLOW_BIN_DIR="$MODFLOW_BIN_PATH"

        echo "MODFLOW_BIN_DIR=$MODFLOW_BIN_DIR" >> $GITHUB_ENV
        echo "$MODFLOW_BIN_DIR" >> $GITHUB_PATH

        echo "Final PATH after export:"
        echo "$MODFLOW_BIN_DIR:$PATH"


    - name: Test with tox
      run: tox -e py${{ matrix.python-version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}